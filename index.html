function getToday(){
  const d=new Date();
  return{
    iso:d.toISOString().split("T")[0],
    jp:d.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}),
    time:d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}),
  };
}
const aHex=()=>mode==="opening"?"#0F6E56":"#534AB7";
const mLabel=()=>mode==="opening"?"開店前チェック":"締め作業チェック";
const tLabel=()=>mode==="opening"?"MORNING":"NIGHT";

function show(id){
  ["home-scr","mgr-scr","staff-scr","ck-scr","cf-scr","rec-scr","done-scr"].forEach(s=>{
    const e=document.getElementById(s);e.classList.remove("on");e.style.display="";
  });
  const t=document.getElementById(id);t.classList.add("on");t.style.display="flex";
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

// ── ストレージ ────────────────────────────────────────────────
async function loadNames(){
  try{
    const r=await window.storage.get(STORAGE_KEY);
    if(r&&r.value){
      const p=JSON.parse(r.value);
      if(Array.isArray(p)) staffNames=p;
    }
  }catch(_){}
}
async function saveNames(){
  try{ await window.storage.set(STORAGE_KEY,JSON.stringify(staffNames)); }catch(_){}
}

// ── HOME ─────────────────────────────────────────────────────
function goHome(){renderHomeRec();show("home-scr");}

function renderHomeRec(){
  const el=document.getElementById("home-rec");
  if(!records.length){el.innerHTML='<div class="rp-empty">記録はまだありません</div>';return;}
  el.innerHTML=records.slice(0,4).map(r=>{
    const col=r.mode==="opening"?"var(--op)":"var(--cl)";
    const pct=Math.round(r.cd/r.ct*100);
    return`<div class="rp-row">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:11px;color:${col};font-weight:500">${r.mode==="opening"?"MORNING":"NIGHT"}</span>
        <span style="font-size:13px;font-weight:500">${r.staff}</span>
      </div>
      <span style="font-size:12px;font-weight:500;color:${pct===100?col:"var(--color-text-secondary)"}">${r.cd}/${r.ct}</span>
    </div>`;
  }).join("");
}

// ── STAFF MANAGER ────────────────────────────────────────────
function showMgr(){
  mgrFrom=document.querySelector(".scr.on")?.id||"home-scr";
  renderMgrList();
  show("mgr-scr");
  document.getElementById("mgr-inp").value="";
  document.getElementById("mgr-err").classList.remove("on");
}

function renderMgrList(){
  const el=document.getElementById("mgr-list");
  if(!staffNames.length){
    el.innerHTML='<p style="font-size:13px;color:var(--color-text-tertiary);padding:8px 0">登録済みのスタッフはいません</p>';
    return;
  }
  el.innerHTML=staffNames.map((n,i)=>`
    <div class="staff-item">
      <i class="ti ti-user" aria-hidden="true" style="font-size:16px;color:var(--color-text-tertiary)"></i>
      <span class="staff-item-name">${n}</span>
      <button class="del-btn" onclick="removeStaff(${i})" aria-label="${n}を削除">
        <i class="ti ti-trash" aria-hidden="true" style="font-size:15px"></i>
      </button>
    </div>`).join("");
}

async function addStaff(){
  const inp=document.getElementById("mgr-inp");
  const name=inp.value.trim();
  const err=document.getElementById("mgr-err");
  if(!name){err.textContent="名前を入力してください";err.classList.add("on");return;}
  if(staffNames.includes(name)){err.textContent=`「${name}」はすでに登録されています`;err.classList.add("on");return;}
  err.classList.remove("on");
  staffNames.push(name);
  await saveNames();
  inp.value="";
  renderMgrList();
  showToast(`「${name}」を登録しました`);
}

async function removeStaff(i){
  const name=staffNames[i];
  staffNames.splice(i,1);
  await saveNames();
  renderMgrList();
  showToast(`「${name}」を削除しました`);
}

function startMode(m){
  mode=m;items=ITEMS[m];checks={};staff="";filter="all";sending=false;
  today=getToday();
  document.getElementById("st-eye").textContent=tLabel();
  document.getElementById("st-eye").style.color=aHex();
  document.getElementById("st-title").textContent=mLabel();
  document.getElementById("st-date").textContent=today.iso;
  document.getElementById("st-em").textContent=m==="opening"?"🌅":"🌙";
  document.getElementById("st-sub").textContent=today.jp;
  document.getElementById("st-inp").value="";
  document.getElementById("st-err").classList.remove("on");
  renderStGrid();updateStBtn();
  show("staff-scr");
}

function renderStGrid(){
  const grid=document.getElementById("st-grid");
  const ac=aHex();
  if(!staffNames.length){
    grid.innerHTML=`<div style="grid-column:span 2;font-size:12px;color:var(--color-text-tertiary);padding:6px 0">
      登録済みスタッフがいません。
      <button onclick="showMgr()" style="color:var(--color-text-info);background:none;border:none;cursor:pointer;font-size:12px">追加する</button>
    </div>`;
    return;
  }
  grid.innerHTML=staffNames.map(n=>`
    <button class="sg-btn${staff===n?" sel":""}" style="${staff===n?`background:${ac};border-color:${ac};color:#fff`:""}"
      onclick="selectStaff('${n}')">
      <i class="ti ti-user" aria-hidden="true" style="font-size:15px;flex-shrink:0"></i>
      <span style="flex:1;text-align:left">${n}</span>
      ${staff===n?`<i class="ti ti-check" aria-hidden="true" style="font-size:14px;flex-shrink:0"></i>`:""}
    </button>`).join("");
}

function selectStaff(n){
  staff=n;
  document.getElementById("st-inp").value="";
  document.getElementById("st-err").classList.remove("on");
  renderStGrid();updateStBtn();
}

function onDirect(v){
  staff=v.trim();
  if(staff) renderStGrid();
  document.getElementById("st-err").classList.remove("on");
  updateStBtn();
}

function updateStBtn(){
  const btn=document.getElementById("st-btn");
  if(staff){
    btn.disabled=false;btn.style.background=aHex();
    btn.innerHTML=`チェック開始 — ${staff} <i class="ti ti-arrow-right" aria-hidden="true"></i>`;
  } else {
    btn.disabled=true;btn.style.background="";
    btn.textContent="記入者を選択してください";
  }
}

function toCheck(){
  if(!staff){document.getElementById("st-err").classList.add("on");return;}
  document.getElementById("ck-mode").textContent=tLabel();
  document.getElementById("ck-mode").style.color=aHex();
  document.getElementById("ck-tt").textContent=mLabel();
  document.getElementById("sbadge-nm").textContent=staff;
  buildFtabs();renderCkBody();
  show("ck-scr");
}
function toStaff(){renderStGrid();updateStBtn();show("staff-scr");}

// ── FILTER / CHECK ────────────────────────────────────────────
function buildFtabs(){
  const areas=[...new Set(items.map(i=>i.area))];
  const ac=aHex();
  const fl=[
    {k:"all",l:"全項目",n:items.length},
    ...areas.map(a=>({k:a,l:a,n:items.filter(i=>i.area===a).length})),
    {k:"pending",l:"未完了",n:items.filter(i=>!checks[i.id]).length},
  ];
  document.getElementById("ftabs").innerHTML=fl.map(f=>{
    const on=filter===f.k;
    return`<button class="ft${on?" on":""}" style="${on?`background:${ac};color:#fff;border-color:${ac}`:""}"
      onclick="setF('${f.k}')">${f.l}(${f.n})</button>`;
  }).join("");
}
function setF(f){filter=f;buildFtabs();renderCkBody();}

function renderCkBody(){
  updBars();buildFtabs();
  const body=document.getElementById("ck-body");body.innerHTML="";
  const vis=filter==="all"?items:filter==="pending"?items.filter(i=>!checks[i.id]):items.filter(i=>i.area===filter);
  if(!vis.length){
    body.innerHTML='<div style="text-align:center;padding:48px 0;color:var(--color-text-tertiary);font-size:13px">該当項目なし</div>';
    updCkBtn();return;
  }
  let la=null;
  vis.forEach(item=>{
    if(item.area!==la){
      const as=AS[item.area]||AS["ゴミ"];
      const d=document.createElement("div");d.className="adiv";
      d.innerHTML=`<div class="adiv-line"></div>
        <span class="adiv-lbl" style="color:${as.c};background:${as.bg};border-color:${as.bd}">${item.area}</span>
        <div class="adiv-line"></div>`;
      body.appendChild(d);la=item.area;
    }
    const ck=!!checks[item.id];const as=AS[item.area]||AS["ゴミ"];
    const btn=document.createElement("button");
    btn.className="ci"+(ck?" ck":"");
    btn.innerHTML=`
      <div class="ci-box${ck?" on":""}" style="${ck?`background:${as.c}`:""}">
        ${ck?`<i class="ti ti-check" aria-hidden="true" style="font-size:13px;color:#fff"></i>`:""}
      </div>
      <div class="ci-tx">
        <div class="ci-lr">
          <span class="ci-lb">${item.label}</span>
          ${item.isHACCP?'<span class="hbg">HACCP</span>':""}
          <span class="abg">${item.area}</span>
        </div>
        <div class="ci-dt">${item.detail}</div>
      </div>`;
    btn.onclick=()=>{checks[item.id]=!checks[item.id];renderCkBody();};
    body.appendChild(btn);
  });
  updCkBtn();
}

function updBars(){
  const hi=items.filter(i=>i.isHACCP),hd=hi.filter(i=>checks[i.id]).length;
  const cd=items.filter(i=>checks[i.id]).length,ct=items.length;
  const hok=hd===hi.length;const ac=aHex();
  document.getElementById("hl").textContent=`HACCP ${hd}/${hi.length}`;
  document.getElementById("hl").style.color=hok?"#0F6E56":"var(--color-text-danger)";
  document.getElementById("hf").style.width=`${Math.round(hd/hi.length*100)}%`;
  document.getElementById("hf").style.background=hok?"#0F6E56":"#E24B4A";
  document.getElementById("tc").textContent=`${cd}/${ct}`;
  document.getElementById("tf").style.width=`${Math.round(cd/ct*100)}%`;
  document.getElementById("tf").style.background=ac;
}

function updCkBtn(){
  const btn=document.getElementById("ck-btn");
  const cd=items.filter(i=>checks[i.id]).length,ct=items.length;
  const pct=Math.round(cd/ct*100);
  btn.disabled=false;
  btn.style.background=pct===100?aHex():"#BA7517";
  btn.innerHTML=`確認へ（${cd}/${ct}件）<i class="ti ti-arrow-right" aria-hidden="true"></i>`;
}

function toConfirm(){buildConfirm();show("cf-scr");}

function buildConfirm(){
  const ac=aHex();
  document.getElementById("cf-eye").textContent=tLabel();
  document.getElementById("cf-eye").style.color=ac;
  document.getElementById("cf-tt").textContent=mLabel();
  const body=document.getElementById("cf-body");body.innerHTML="";
  const cd=items.filter(i=>checks[i.id]).length,ct=items.length,pct=Math.round(cd/ct*100);

  body.innerHTML=`<div style="font-size:16px;font-weight:500;margin-bottom:4px">確認して送信</div>
    <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:16px;line-height:1.6">チェック済み項目がNotionに記録されます。確認者はNotionの承認ビューで対応してください。</div>`;

  const bc=document.createElement("div");bc.className="scard";
  bc.innerHTML=[
    {ic:"ti-user",lb:"記入者",vl:staff},
    {ic:"ti-calendar",lb:"日付",vl:today.jp},
    {ic:mode==="opening"?"ti-sunrise":"ti-moon",lb:"種別",vl:mLabel()},
    {ic:"ti-chart-bar",lb:"完了",vl:`${cd}/${ct}（${pct}%）`,danger:pct<100},
  ].map(r=>`<div class="srow">
    <i class="ti ${r.ic} srow-ic" aria-hidden="true"></i>
    <span class="srow-lb">${r.lb}</span>
    <span class="srow-vl" style="${r.danger?"color:var(--color-text-danger)":""}">${r.vl}</span>
  </div>`).join("");
  body.appendChild(bc);

  const ah=document.createElement("div");
  ah.style.cssText="font-size:11px;color:var(--color-text-tertiary);font-weight:500;letter-spacing:.08em;margin-bottom:8px";
  ah.textContent="エリア別 完了状況";
  body.appendChild(ah);

  const areas=[...new Set(items.map(i=>i.area))];
  areas.forEach(area=>{
    const as=AS[area]||AS["ゴミ"];
    const ai=items.filter(i=>i.area===area);
    const ckd=ai.filter(i=>checks[i.id]),unc=ai.filter(i=>!checks[i.id]);
    const aok=ckd.length===ai.length;
    const block=document.createElement("div");block.className="ablock";
    block.style.borderColor=aok?`${as.bd}88`:"var(--color-border-tertiary)";
    block.innerHTML=`<div class="ablock-h">
      <span style="font-size:13px;font-weight:500;color:${as.c}">${area}</span>
      <span style="font-size:13px;font-weight:500;color:${aok?as.c:"var(--color-text-danger)"}">${ckd.length}/${ai.length}</span>
    </div>
    <div class="ablock-p">
      ${ckd.map(i=>`<span class="pill" style="background:${as.bg};color:${as.c};border:0.5px solid ${as.bd}">
        <i class="ti ti-check" aria-hidden="true" style="font-size:10px;vertical-align:-1px"></i> ${i.label}</span>`).join("")}
      ${unc.map(i=>`<span class="pill pill-ng">${i.label}</span>`).join("")}
    </div>`;
    body.appendChild(block);
  });

  const hi=items.filter(i=>i.isHACCP),hd=hi.filter(i=>checks[i.id]).length,hok=hd===hi.length;
  const hb=document.createElement("div");hb.className="hblock";
  hb.style.borderColor=hok?"#9FE1CB":"#F7C1C1";
  hb.style.background=hok?"#E1F5EE":"#FCEBEB";
  hb.innerHTML=`<div style="font-size:12px;font-weight:500;color:${hok?"#0F6E56":"#A32D2D"};margin-bottom:${hok?0:6}px">
    <i class="ti ${hok?"ti-shield-check":"ti-alert-triangle"}" aria-hidden="true" style="font-size:14px;vertical-align:-2px;margin-right:5px"></i>
    ${hok?"HACCP 全項目完了":"HACCP 未完了あり"}
  </div>
  ${!hok?hi.filter(i=>!checks[i.id]).map(i=>`<div style="font-size:12px;color:#993C1D;margin-top:3px;padding-left:4px">・${i.label}</div>`).join(""):""}`;
  body.appendChild(hb);

  const ft=document.createElement("div");
  ft.style.cssText="font-size:11px;color:var(--color-text-tertiary);text-align:center;margin-top:8px";
  ft.textContent="確認者（小沢健人）はNotionの承認ビューで対応します";
  body.appendChild(ft);
  updSendBtn();
}

function updSendBtn(){
  const btn=document.getElementById("send-btn");
  const cd=items.filter(i=>checks[i.id]).length,ct=items.length,pct=Math.round(cd/ct*100);
  btn.disabled=sending;
  btn.style.background=sending?"var(--color-border-tertiary)":pct===100?aHex():"#BA7517";
  btn.innerHTML=sending
    ?`<i class="ti ti-loader-2" aria-hidden="true"></i> Notionに送信中...`
    :pct===100
      ?`<i class="ti ti-check" aria-hidden="true"></i> 全完了 — Notionに記録する`
      :`${cd}/${ct}件完了 — 記録する`;
}

// ── SEND（DB構造に完全一致させた送信） ───────────────────────
async function handleSend(){
  if(sending)return;
  sending=true;updSendBtn();

  const cd=items.filter(i=>checks[i.id]).length,ct=items.length;
  const haccpOk=items.filter(i=>i.isHACCP).every(i=>checks[i.id]);

  // DBのプロパティ名に合わせてチェックボックス値を組み立て
  const props=mode==="opening"?OPENING_PROPS:CLOSING_PROPS;
  const checksObj={};
  props.forEach(key=>{checksObj[key]=!!checks[key];});

  const payload={
    mode,
    date:today.iso,
    staff,
    status:haccpOk?"✅ 完了":"⚠️ 要確認",
    memo:"",
    checks:checksObj,
  };

  let ok=false;
  try{
    const res=await fetch(GAS_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify(payload),
    });
    const text=await res.text();
    const data=JSON.parse(text);
    ok=data.ok===true;
    if(!ok) console.error("Notion送信エラー:",data.error);
  }catch(err){
    console.error("通信エラー:",err);
  }

  records.push({mode,staff,cd,ct,time:today.time,checkedItems:items.filter(i=>checks[i.id]).map(i=>i.id),ok});
  sending=false;
  showDone(cd,ct,haccpOk,ok);
}

function showDone(cd,ct,haccpOk,notionOk){
  const ac=aHex(),pct=Math.round(cd/ct*100);
  document.getElementById("d-ic").textContent=pct===100?"✅":"⚠️";
  document.getElementById("d-tt").textContent=mLabel();
  document.getElementById("d-sb").textContent=`${today.jp} · ${staff}`;
  document.getElementById("d-home").style.background=ac;
  document.getElementById("d-sg").innerHTML=[
    {l:"完了率",  v:`${pct}%`,              danger:pct<100},
    {l:"HACCP",  v:haccpOk?"全完了":"未完了あり", danger:!haccpOk},
    {l:"完了項目",v:`${cd}件`,              danger:false},
    {l:"Notion", v:notionOk?"✓ 記録済み":"要確認", danger:!notionOk},
  ].map(s=>`<div class="done-st">
    <div class="done-sl">${s.l}</div>
    <div class="done-sv" style="color:${s.danger?"var(--color-text-danger)":ac}">${s.v}</div>
  </div>`).join("");
  show("done-scr");
}

function restartSame(){startMode(mode);}

// ── RECORDS ──────────────────────────────────────────────────
function showRecords(){
  document.getElementById("rec-dt").textContent=today.jp||getToday().jp;
  filterRec("all");show("rec-scr");
}

function filterRec(f){
  ["rf-all","rf-op","rf-cl"].forEach(id=>{
    const b=document.getElementById(id);
    b.classList.remove("on");b.style.background="transparent";
    b.style.color="var(--color-text-secondary)";b.style.borderColor="var(--color-border-tertiary)";
  });
  const active=document.getElementById(f==="all"?"rf-all":f==="opening"?"rf-op":"rf-cl");
  active.classList.add("on");active.style.background="var(--color-text-primary)";
  active.style.color="var(--color-background-primary)";active.style.borderColor="transparent";
  const body=document.getElementById("rec-body");
  const list=f==="all"?records:records.filter(r=>r.mode===f);
  if(!list.length){
    body.innerHTML=`<div style="text-align:center;padding:48px 0;color:var(--color-text-tertiary);font-size:13px">記録がありません</div>`;
    return;
  }
  body.innerHTML="";
  list.forEach(r=>{
    const ch=r.mode==="opening"?"#0F6E56":"#534AB7";
    const pct=Math.round(r.cd/r.ct*100);
    const mi=ITEMS[r.mode]||[];
    const hd=(r.checkedItems||[]).filter(id=>{const it=mi.find(i=>i.id===id);return it&&it.isHACCP;}).length;
    const ht=mi.filter(i=>i.isHACCP).length;
    const card=document.createElement("div");card.style.cssText="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:10px";
    card.innerHTML=`<div style="padding:12px 14px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;justify-content:space-between">
      <div>
        <div style="font-size:11px;font-weight:500;color:${ch};letter-spacing:.08em">${r.mode==="opening"?"MORNING":"NIGHT"}</div>
        <div style="font-size:15px;font-weight:500">${r.staff}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:var(--color-text-tertiary)">${r.time}</div>
        <div style="font-size:13px;font-weight:500;color:${pct===100?ch:"var(--color-text-danger)"}">${r.cd}/${r.ct}</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;padding:8px 14px;border-bottom:0.5px solid var(--color-border-tertiary)">
      <span style="font-size:12px;color:var(--color-text-secondary)">完了率 <strong style="color:${pct===100?ch:"var(--color-text-danger)"}">${pct}%</strong></span>
      <span style="font-size:12px;color:var(--color-text-secondary)">HACCP <strong style="color:${hd===ht?ch:"var(--color-text-danger)"}">${hd}/${ht}</strong></span>
      <span style="font-size:12px;color:var(--color-text-secondary)">Notion <strong style="color:${r.ok?ch:"var(--color-text-danger)"}">${r.ok?"✓":"要確認"}</strong></span>
    </div>
    <div style="padding:8px 12px 10px;display:flex;flex-wrap:wrap;gap:4px">${(r.checkedItems||[]).slice(0,6).map(id=>{
      const it=mi.find(i=>i.id===id);if(!it)return"";
      const as=AS[it.area]||AS["ゴミ"];
      return`<span style="font-size:11px;padding:2px 7px;border-radius:var(--border-radius-md);background:${as.bg};color:${as.c};border:0.5px solid ${as.bd}">${it.label}</span>`;
    }).join("")}${(r.checkedItems||[]).length>6?`<span style="font-size:11px;padding:2px 7px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-tertiary)">+${r.checkedItems.length-6}</span>`:""}</div>`;
    body.appendChild(card);
  });
}
